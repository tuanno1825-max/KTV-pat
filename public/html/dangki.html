<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký | Karaoke Together</title>
    <link rel="stylesheet" href="../css/dangki.css" />
  </head>
  <body>
    <main class="khung-xac-thuc">
      <section class="the-xac-thuc" aria-labelledby="tieu-de-dang-ky">
        <a class="logo-xac-thuc" href="/" aria-label="Về trang chủ">
          <img src="../image/logo.png" alt="Karaoke Together" />
        </a>

        <div class="noi-dung-xac-thuc">
          <p class="nhan-xac-thuc">KARAOKE TOGETHER</p>
          <h1 id="tieu-de-dang-ky">Tạo tài khoản mới</h1>
          <p class="mo-ta-xac-thuc">
            Đăng ký để đặt phòng nhanh hơn và quản lý những buổi hát của bạn.
          </p>

          <form class="bieu-mau-xac-thuc">
            <div class="nhom-truong">
              <label for="ho-ten">Họ và tên</label>
              <input id="ho-ten" type="text" placeholder="Nhập họ và tên" />
            </div>

            <div class="nhom-truong">
              <label for="email-dang-ky">Email</label>
              <input
                id="email-dang-ky"
                type="email"
                placeholder="you@example.com"
              />
            </div>

            <div class="nhom-truong">
              <label for="mat-khau-dang-ky">Mật khẩu</label>
              <input
                id="mat-khau-dang-ky"
                type="password"
                placeholder="Tối thiểu 6 ký tự"
              />
            </div>

            <div class="nhom-truong">
              <label for="xac-nhan-mat-khau">Xác nhận mật khẩu</label>
              <input
                id="xac-nhan-mat-khau"
                type="password"
                placeholder="Nhập lại mật khẩu"
              />
            </div>

            <label class="ghi-nho dieu-khoan"
              ><input type="checkbox" /> Tôi đồng ý với điều khoản sử
              dụng</label
            >
            <button class="nut-xac-thuc" type="submit">Tạo tài khoản</button>
          </form>

          <p class="doi-form">
            Đã có tài khoản? <a href="dangnhap.html">Đăng nhập</a>
          </p>
          <a class="ve-trang-chu" href="/">← Về trang chủ</a>
        </div>
      </section>
    </main>
  </body>
</html>
