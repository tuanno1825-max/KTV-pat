<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập | Karaoke Together</title>
    <link rel="stylesheet" href="../css/dangnhap.css" />
    <script src="../js/xac-thuc-khach.js" defer></script>
  </head>
  <body>
    <main class="khung-xac-thuc">
      <section class="the-xac-thuc" aria-labelledby="tieu-de-dang-nhap">
        <a class="logo-xac-thuc" href="/" aria-label="Về trang chủ">
          <img src="../image/logo.png" alt="Karaoke Together" />
        </a>

        <div class="noi-dung-xac-thuc">
          <p class="nhan-xac-thuc">KARAOKE TOGETHER</p>
          <h1 id="tieu-de-dang-nhap">Chào mừng trở lại</h1>
          <p class="mo-ta-xac-thuc">
            Đăng nhập để tiếp tục đặt phòng và tận hưởng những giờ hát vui vẻ.
          </p>

          <form
            class="bieu-mau-xac-thuc"
            id="form-dang-nhap"
            data-che-do="dang-nhap"
          >
            <p class="thong-bao-xac-thuc" role="status" aria-live="polite"></p>
            <div class="nhom-truong">
              <label for="email-dang-nhap">Email</label>
              <input
                id="email-dang-nhap"
                name="email"
                type="email"
                autocomplete="email"
                required
                placeholder="Nhập email"
              />
            </div>

            <div class="nhom-truong">
              <label for="mat-khau-dang-nhap">Mật khẩu</label>
              <input
                id="mat-khau-dang-nhap"
                name="matKhau"
                type="password"
                autocomplete="current-password"
                required
                placeholder="Nhập mật khẩu"
              />
            </div>

            <div class="tuy-chon-form">
              <label class="ghi-nho"
                ><input type="checkbox" /> Ghi nhớ đăng nhập</label
              >
              <a href="#quen-mat-khau" id="mo-quen-mat-khau">Quên mật khẩu?</a>
            </div>

            <button class="nut-xac-thuc" type="submit">Đăng nhập</button>
          </form>

          <form
            class="bieu-mau-xac-thuc form-quen-mat-khau"
            id="form-quen-mat-khau"
            hidden
          >
            <p class="thong-bao-xac-thuc" role="status" aria-live="polite"></p>
            <div class="nhom-truong">
              <label for="email-quen-mat-khau">Email tài khoản</label>
              <input
                id="email-quen-mat-khau"
                name="email"
                type="email"
                autocomplete="email"
                required
                placeholder="Nhập email đã đăng ký"
              />
            </div>
            <button class="nut-xac-thuc" type="submit">Gửi yêu cầu</button>
            <button
              class="nut-quay-lai-dang-nhap"
              id="dong-quen-mat-khau"
              type="button"
            >
              Quay lại đăng nhập
            </button>
          </form>

          <p class="doi-form">
            Chưa có tài khoản? <a href="dangki.html">Đăng ký ngay</a>
          </p>
          <a class="ve-trang-chu" href="/">← Về trang chủ</a>
        </div>
      </section>
    </main>
  </body>
</html>
